spring:
  application:
    name: eurmad-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:eurmad}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:eurmad}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:simulation_only}}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

# Product safety boundary. SIMULATION is the only supported mode; any other value or
# live-enabled=true aborts startup (see FintechProperties).
fintech:
  mode: SIMULATION
  live-enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
