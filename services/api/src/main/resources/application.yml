spring:
  application:
    name: eurmad-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:eurmad}}
    username: ${DATABASE_USERNAME:${POSTGRES_USER:eurmad}}
    password: ${DATABASE_PASSWORD:${POSTGRES_PASSWORD:simulation_only}}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

# Product safety boundary. SIMULATION is the only supported mode; any other value or
# live-enabled=true aborts startup (see FintechProperties).
fintech:
  mode: SIMULATION
  live-enabled: false
  # Deterministic KYC sandbox (FX-005): every synthetic verification resolves to this outcome
  # (APPROVED | REJECTED). PENDING is rejected at startup until a signed sandbox callback can
  # resolve pending cases. No real KYC provider exists in the MVP.
  kyc:
    sandbox:
      outcome: ${KYC_SANDBOX_OUTCOME:APPROVED}
  # OIDC resource server (FX-004). Tokens are validated locally against the issuer's JWKS:
  # signature (RS256/ES256 only), iss, aud, exp/nbf and sub. Defaults point at a local
  # development IdP only; plain http is accepted for loopback hosts only.
  security:
    oidc:
      issuer: ${OIDC_ISSUER:http://localhost:8180/realms/eurmad-sim}
      jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/eurmad-sim/protocol/openid-connect/certs}
      audience: ${OIDC_AUDIENCE:eurmad-api}
      clock-skew: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
