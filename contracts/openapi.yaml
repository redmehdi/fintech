        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags:
      - Beneficiaries
      operationId: deleteBeneficiary
      summary: Delete one of the caller's beneficiaries
      description: Soft-deletes the beneficiary. It is then unavailable to every read and can no
        longer be referenced by new operations; the record is retained for audit and historical
        traceability. Deleting a beneficiary owned by another customer, an already deleted one or
        an unknown ID returns the same `404`.
      responses:
        '204':
          description: Deleted
          headers:
            X-Correlation-Id:
              description: Server-generated request identifier, also recorded in the audit event.
              schema:
                type: string
                format: uuid
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/quotes:
    post:
      tags:
      - Quotes
      operationId: createQuote
      summary: Issue an expiring indicative simulated FX quote
      description: Issues an immutable, simulation-only quote owned by the caller. Requires an
        `ACTIVE` account with KYC `APPROVED` (`422` otherwise). `rate` is target currency per one
        source currency from the deterministic simulator (illustrative, not a market rate);
        `targetAmountMinor` is `sourceAmountMinor × rate` rounded HALF_EVEN to the target minor
        unit. The fee is charged in the source currency as `feeSourceMinor = fixed +
        HALF_EVEN(sourceAmountMinor × basisPoints / 10000)`; only the variable part is rounded, to
        the source minor unit, and the fixed part is added unrounded (a EUR 1.00 quote at 1.99 +
        0.50 % has fee 199, not 200). The fixed and variable components are recorded with the
        immutable quote. `totalDebitMinor = sourceAmountMinor + feeSourceMinor`. The
        quote expires server-side 10 minutes after issue; an expired or consumed quote cannot be
        used. Malformed fields, values outside the enums, equal source and target currencies, a
        zero amount, any field that is not a JSON string, a non-JSON body, or a missing or
        malformed `Idempotency-Key` return `400`; leading zeros in `sourceAmountMinor` are not
        significant. A source amount outside the simulated per-currency
        limits (EUR 1.00–10,000.00; MAD 10.00–100,000.00) returns `422`. Replaying the same key
        with an identical request returns the originally issued quote (its `status` reflects
        expiry); the same key with a different request returns `409`. If a concurrent request
        from the same customer holds the creation lock for longer than a short timeout, nothing is
        written and `503` with `Retry-After` is returned; retrying with the same `Idempotency-Key`
        is safe. No live rate, FX execution or payment is ever performed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '201':
          description: Created
          headers:
            X-Correlation-Id:
              description: Server-generated request identifier, recorded in the audit event when this
                request issued the quote.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: State or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Eligibility or business-rule failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Temporarily unable to process because of concurrent requests from the same
            customer; nothing was written. Retry with the same `Idempotency-Key`.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Unique key per actor+operation; replay with different body returns 409.
          Printable US-ASCII without spaces.
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[\x21-\x7E]{8,128}$
  /v1/transfers:
    get:
      tags:
      - Transfers
      operationId: listTransfers
      summary: List own transfer history
      description: Returns only the caller's own transfers, newest first, each in its current
        state. Available to any provisioned customer, including one whose account or KYC is no
        longer eligible to create transfers.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transfer'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: State or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Eligibility or business-rule failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Transfers
      operationId: createTransfer
      summary: Create transfer with an unused owned quote; simulation only
      description: Creates a simulation-only transfer owned by the caller. No funds are held,
        moved or exchanged and no provider instruction is sent. Requires an `ACTIVE` account with
        KYC `APPROVED` (`422` otherwise). The quote must be the caller's own, unexpired and not yet
        consumed; it is consumed by this request and can back at most one transfer. An unknown or
        foreign quote or beneficiary, or a deleted beneficiary, returns `404`; an already consumed
        quote returns `409`; an expired quote returns `422`. The beneficiary must be in the payout
        country of the quote's target currency (`MAD` → `MA`, `EUR` → `ES`), otherwise `422`.
        The transfer is returned in `AWAITING_FUNDING` and then advances only along the documented
        state machine in response to simulated provider events. Malformed or non-canonical UUIDs,
        a `purpose` outside the enum, any field that is not a JSON string, a non-JSON body, or a
        missing or malformed `Idempotency-Key` return `400`. Replaying the same key with an
        identical request returns the originally created transfer in its current state (also
        after its quote has expired, its beneficiary was deleted, or the account or KYC is no
        longer eligible); the same key with a different request returns `409`. Eligibility (`422`)
        applies only to a request that would create a new transfer. If a concurrent request from
        the same customer, or a concurrent change to the quote or beneficiary, holds a required
        lock for longer than a short timeout, nothing is written and `503` with `Retry-After` is
        returned; retrying with the same `Idempotency-Key` is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferCreate'
      responses:
        '201':
          description: Created
          headers:
            X-Correlation-Id:
              description: Server-generated request identifier, recorded in the lifecycle and audit
                events when this request created the transfer.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: State or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Eligibility or business-rule failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Temporarily unable to process because of a concurrent request from the same
            customer or a concurrent change to the quote or beneficiary; nothing was written. Retry
            with the same `Idempotency-Key`.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Unique key per actor+operation; replay with different body returns 409.
          Printable US-ASCII without spaces.
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[\x21-\x7E]{8,128}$
