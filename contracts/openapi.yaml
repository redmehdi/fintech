  /v1/webhooks/simulator:
    post:
      tags:
      - Sandbox Webhooks
      operationId: receiveSimulatorEvent
      summary: Receive mock partner callback; signed and replay-protected
      description: Use signature over original raw request body and timestamp. No customer JWT. Only enabled in
        trusted simulator environment. Body schema is provider-specific and should be authenticated before parsing.
      security: []
      parameters:
      - name: X-Webhook-Signature
        in: header
        required: true
        schema:
          type: string
      - name: X-Webhook-Timestamp
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Accepted for processing
        '400':
          description: Invalid payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Signature or timestamp invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflicting event ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token with required scope, issuer, audience
  schemas:
    Problem:
      type: object
      description: Shared API error envelope. Messages and optional details contain only client-safe information.
      required:
      - code
      - message
      - correlationId
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
          format: uuid
          description: Server-generated error identifier, also returned in the X-Correlation-Id response header.
        details:
          type: object
          additionalProperties: true
    Customer:
      type: object
      required:
      - id
      - residencyCountry
      - kycStatus
      - status
      properties:
        id:
          type: string
          format: uuid
        residencyCountry:
          type: string
          enum:
          - ES
          - MA
        kycStatus:
          type: string
          enum:
          - NOT_STARTED
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - CLOSED
    KycStatus:
      type: object
      required:
      - status
      - mode
      properties:
        status:
          type: string
          enum:
          - NOT_STARTED
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
        mode:
          type: string
          enum:
          - SIMULATION
    KycSession:
      type: object
      required:
      - id
      - status
      - mode
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
        mode:
          type: string
          enum:
          - SIMULATION
        mockVerificationUrl:
          type: string
          format: uri
          description: Only available when local sandbox is enabled
    BeneficiaryCreate:
      type: object
      required:
      - displayName
      - country
      - payoutMethod
      - destinationTokenRef
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        country:
          type: string
          enum:
          - ES
          - MA
        payoutMethod:
          type: string
          enum:
          - BANK_ACCOUNT
          - PARTNER_CASH_PICKUP
        destinationTokenRef:
          type: string
          description: Opaque destination token created by trusted sandbox or future regulated PSP; never raw account
            credentials
          minLength: 1
    Beneficiary:
      type: object
      required:
      - id
      - displayName
      - country
      - payoutMethod
      - maskedDestination
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        country:
          type: string
          enum:
          - ES
          - MA
        payoutMethod:
          type: string
          enum:
          - BANK_ACCOUNT
          - PARTNER_CASH_PICKUP
        maskedDestination:
          type: string
    TransferPurpose:
      type: string
      enum:
      - FAMILY_SUPPORT
      - PERSONAL_TRANSFER
      - EDUCATION
      - OTHER_REVIEW
    QuoteRequest:
      type: object
      required:
      - sourceCurrency
      - targetCurrency
      - sourceAmountMinor
      - purpose
      properties:
        sourceCurrency:
          type: string
          enum:
          - EUR
          - MAD
        targetCurrency:
          type: string
          enum:
          - EUR
          - MAD
        sourceAmountMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        purpose:
          $ref: '#/components/schemas/TransferPurpose'
    Quote:
      type: object
      required:
      - id
      - sourceCurrency
      - targetCurrency
      - sourceAmountMinor
      - targetAmountMinor
      - feeSourceMinor
      - totalDebitMinor
      - rate
      - rateSource
      - expiresAt
      - mode
      - status
      properties:
        id:
          type: string
          format: uuid
        sourceCurrency:
          type: string
          enum:
          - EUR
          - MAD
        targetCurrency:
          type: string
          enum:
          - EUR
          - MAD
        sourceAmountMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        targetAmountMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        feeSourceMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        totalDebitMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        rate:
          type: string
          description: Decimal string; target currency per one source currency
          pattern: ^[0-9]+(\.[0-9]{1,12})?$
        rateSource:
          type: string
        expiresAt:
          type: string
          format: date-time
        mode:
          type: string
          enum:
          - SIMULATION
        status:
          type: string
          enum:
          - ISSUED
          - CONSUMED
          - EXPIRED
    TransferCreate:
      type: object
      required:
      - quoteId
      - beneficiaryId
      - purpose
      properties:
        quoteId:
          type: string
          format: uuid
        beneficiaryId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/TransferPurpose'
    Transfer:
      type: object
      required:
      - id
      - quoteId
      - beneficiaryId
      - purpose
      - status
      - mode
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        quoteId:
          type: string
          format: uuid
        beneficiaryId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/TransferPurpose'
        status:
          type: string
          enum:
          - CREATED
          - AWAITING_KYC
          - AWAITING_FUNDING
          - FUNDING_CONFIRMED
          - PROCESSING
          - REVIEW_REQUIRED
          - COMPLETED
          - REJECTED
          - CANCELLED
          - FAILED
          - REFUND_PENDING
          - REFUNDED
        mode:
          type: string
          enum:
          - SIMULATION
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OfferCreate:
      type: object
      required:
      - sourceCurrency
      - targetCurrency
      - sourceTotalMinor
      - limitRate
      - expiresAt
      properties:
        sourceCurrency:
          type: string
          enum:
          - EUR
          - MAD
        targetCurrency:
          type: string
          enum:
          - EUR
          - MAD
        sourceTotalMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        limitRate:
          type: string
          description: Decimal string; target currency per one source currency
          pattern: ^[0-9]+(\.[0-9]{1,12})?$
        expiresAt:
          type: string
          format: date-time
    Offer:
      type: object
      required:
      - id
      - sourceCurrency
      - targetCurrency
      - sourceTotalMinor
      - sourceReservedMinor
      - sourceFilledMinor
      - limitRate
      - status
      - expiresAt
      - isOwnOffer
      properties:
        id:
          type: string
          format: uuid
        sourceCurrency:
          type: string
          enum:
          - EUR
          - MAD
        targetCurrency:
          type: string
          enum:
          - EUR
          - MAD
        sourceTotalMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        sourceReservedMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        sourceFilledMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        limitRate:
          type: string
          description: Decimal string; target currency per one source currency
          pattern: ^[0-9]+(\.[0-9]{1,12})?$
        status:
          type: string
          enum:
          - OPEN
          - RESERVED
          - MATCHED
          - CANCELLED
          - EXPIRED
        expiresAt:
          type: string
          format: date-time
        isOwnOffer:
          type: boolean
    Match:
      type: object
      required:
      - id
      - offerAId
      - offerBId
      - sourceAReservedMinor
      - sourceBReservedMinor
      - canonicalMadPerEurRate
      - status
      - acceptedByMe
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        offerAId:
          type: string
          format: uuid
        offerBId:
          type: string
          format: uuid
        sourceAReservedMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        sourceBReservedMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        canonicalMadPerEurRate:
          type: string
          description: Decimal string; target currency per one source currency
          pattern: ^[0-9]+(\.[0-9]{1,12})?$
        status:
          type: string
          enum:
          - PROPOSED
          - AGREED_SIMULATION_ONLY
          - DECLINED
          - EXPIRED
        acceptedByMe:
          type: boolean
        expiresAt:
          type: string
          format: date-time
    Review:
      type: object
      required:
      - id
      - resourceType
      - resourceId
      - reasonCode
      - status
      properties:
        id:
          type: string
          format: uuid
        resourceType:
          type: string
          enum:
          - TRANSFER
          - KYC_CASE
          - FX_MATCH
        resourceId:
          type: string
          format: uuid
        reasonCode:
          type: string
        status:
          type: string
          enum:
          - OPEN
          - APPROVED
          - REJECTED
    ReviewDecision:
      type: object
      required:
      - decision
      - reasonCode
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
        reasonCode:
          type: string
          minLength: 3
          maxLength: 100
        comment:
          type: string
          maxLength: 1000
    StatusAck:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
