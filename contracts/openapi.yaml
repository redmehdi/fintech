  /v1/webhooks/simulator:
    post:
      tags:
      - Sandbox Webhooks
      operationId: receiveSimulatorEvent
      summary: Receive mock partner callback; signed and replay-protected
      description: Use signature over original raw request body and timestamp. No customer JWT. Only enabled in
        trusted simulator environment. Body schema is provider-specific and should be authenticated before parsing.
      security: []
      parameters:
      - name: X-Webhook-Signature
        in: header
        required: true
        schema:
          type: string
      - name: X-Webhook-Timestamp
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '202':
          description: Accepted for processing
        '400':
          description: Invalid payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Signature or timestamp invalid
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflicting event ID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token from the trusted issuer. The API verifies the asymmetric signature
        (RS256/ES256) against the issuer JWKS and requires the configured `iss`, an `aud` containing
        the API audience, a non-expired `exp`, and a non-blank `sub`. Customer operations require
        the `eurmad.customer` scope; role claims are not honored. The `sub` maps to exactly one
        customer, and an unprovisioned subject receives `404`. Resources owned by another customer
        also return `404`.
  schemas:
    Problem:
      type: object
      description: Shared API error envelope. Messages and optional details contain only client-safe information.
      required:
      - code
      - message
      - correlationId
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string
          format: uuid
          description: Server-generated error identifier, also returned in the X-Correlation-Id response header.
        details:
          type: object
          additionalProperties: true
    Customer:
      type: object
      required:
      - id
      - residencyCountry
      - kycStatus
      - status
      properties:
        id:
          type: string
          format: uuid
        residencyCountry:
          type: string
          enum:
          - ES
          - MA
        kycStatus:
          type: string
          enum:
          - NOT_STARTED
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - CLOSED
    KycStatus:
      type: object
      required:
      - status
      - mode
      properties:
        status:
          type: string
          enum:
          - NOT_STARTED
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
        mode:
          type: string
          enum:
          - SIMULATION
    KycSession:
      type: object
      required:
      - id
      - status
      - mode
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
        mode:
          type: string
          enum:
          - SIMULATION
        mockVerificationUrl:
          type: string
          format: uri
          description: Only available when local sandbox is enabled
    BeneficiaryCreate:
      type: object
      required:
      - displayName
      - country
      - payoutMethod
      - destinationTokenRef
      properties:
        displayName:
          type: string
          description: Leading and trailing whitespace is removed; the result must be non-blank and
            free of control characters. Length is counted in Unicode code points.
          minLength: 1
          maxLength: 120
        country:
          type: string
          enum:
          - ES
          - MA
        payoutMethod:
          type: string
          enum:
          - BANK_ACCOUNT
          - PARTNER_CASH_PICKUP
        destinationTokenRef:
          type: string
          description: Opaque destination token created by trusted sandbox or future regulated PSP; never raw account
            credentials. In SIMULATION mode only tokens issued by the sandbox registry are accepted,
            and only for the `country` and `payoutMethod` they were issued for; a value that merely
            looks like a sandbox token returns `422`. Sandbox tokens are synthetic and resolve to no
            real destination. ES/BANK_ACCOUNT (`sim-token:es-bank-esb1`, `sim-token:es-bank-esb2`,
            `sim-token:es-bank-esb3`); ES/PARTNER_CASH_PICKUP (`sim-token:es-cash-esc1`,
            `sim-token:es-cash-esc2`); MA/BANK_ACCOUNT (`sim-token:ma-bank-mab1`,
            `sim-token:ma-bank-mab2`, `sim-token:ma-bank-mab3`); MA/PARTNER_CASH_PICKUP
            (`sim-token:ma-cash-mac1`, `sim-token:ma-cash-mac2`). The token is stored but never
            returned.
          minLength: 1
    Beneficiary:
      type: object
      required:
      - id
      - displayName
      - country
      - payoutMethod
      - maskedDestination
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        country:
          type: string
          enum:
          - ES
          - MA
        payoutMethod:
          type: string
          enum:
          - BANK_ACCOUNT
          - PARTNER_CASH_PICKUP
        maskedDestination:
          type: string
          description: Four mask characters followed by the last (at most four) characters of the
            opaque destination token, e.g. `****mab1`. Never contains destination details.
    TransferPurpose:
      type: string
      enum:
      - FAMILY_SUPPORT
      - PERSONAL_TRANSFER
      - EDUCATION
      - OTHER_REVIEW
    QuoteRequest:
      type: object
      required:
      - sourceCurrency
      - targetCurrency
      - sourceAmountMinor
      - purpose
      properties:
        sourceCurrency:
          type: string
          enum:
          - EUR
          - MAD
        targetCurrency:
          type: string
          enum:
          - EUR
          - MAD
        sourceAmountMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        purpose:
          $ref: '#/components/schemas/TransferPurpose'
    Quote:
      type: object
      required:
      - id
      - sourceCurrency
      - targetCurrency
      - sourceAmountMinor
      - targetAmountMinor
      - feeSourceMinor
      - totalDebitMinor
      - rate
      - rateSource
      - expiresAt
      - mode
      - status
      properties:
        id:
          type: string
          format: uuid
        sourceCurrency:
          type: string
          enum:
          - EUR
          - MAD
        targetCurrency:
          type: string
          enum:
          - EUR
          - MAD
        sourceAmountMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        targetAmountMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        feeSourceMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        totalDebitMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        rate:
          type: string
          description: Decimal string; target currency per one source currency
          pattern: ^[0-9]+(\.[0-9]{1,12})?$
        rateSource:
          type: string
          description: Origin of the rate. In SIMULATION mode always `SIMULATED_ILLUSTRATIVE`.
        expiresAt:
          type: string
          format: date-time
          description: Server-side expiry instant (UTC). The quote is `EXPIRED` from this instant on.
        mode:
          type: string
          enum:
          - SIMULATION
        status:
          type: string
          enum:
          - ISSUED
          - CONSUMED
          - EXPIRED
    TransferCreate:
      type: object
      required:
      - quoteId
      - beneficiaryId
      - purpose
      properties:
        quoteId:
