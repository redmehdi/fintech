openapi: 3.0.3
info:
  title: EUR-MAD Transfer and P2P Exchange API
  version: 0.1.0
  description: Simulation-only contract. All real payment/FX settlement is disabled pending legal clearance and
    licensed partner capability.
servers:
- url: http://localhost:8080
  description: Local sandbox only
security:
- bearerAuth: []
tags:
- name: Identity
- name: KYC
- name: Beneficiaries
- name: Quotes
- name: Transfers
- name: Marketplace
- name: Operations
- name: Sandbox Webhooks
paths:
  /v1/me:
    get:
      tags:
      - Identity
      operationId: getCurrentCustomer
      summary: Get current customer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: State or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Eligibility or business-rule failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kyc/status:
    get:
      tags:
      - KYC
      operationId: getKycStatus
      summary: Read current KYC status
      description: Returns the caller's own KYC status. Only `APPROVED` customers with an `ACTIVE`
        account may submit eligible operations (quotes, transfers, offers, match acceptance); all
        others receive `422`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycStatus'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: State or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Eligibility or business-rule failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/kyc/sessions:
    post:
      tags:
      - KYC
      operationId: createKycSession
      summary: Create a synthetic sandbox verification session
      description: Starts a deterministic sandbox verification for the caller. No request body is
        accepted and no identity documents or document data are collected or stored. Allowed only
        from `NOT_STARTED` or `EXPIRED`; any other KYC status returns `409`, and a non-`ACTIVE`
        account returns `422`. The sandbox may decide immediately (`APPROVED`/`REJECTED`) or leave
        the session `PENDING`. A request carrying any body returns `400` without changing state.
      responses:
        '201':
          description: Created
          headers:
            X-Correlation-Id:
              description: Server-generated request identifier, also recorded in the KYC audit events.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycSession'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: State or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Eligibility or business-rule failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/beneficiaries:
    get:
      tags:
      - Beneficiaries
      operationId: listBeneficiaries
      summary: List current user beneficiaries
      description: Returns only the caller's own beneficiaries that have not been deleted, oldest
        first. Destination tokens are never returned; only `maskedDestination` is exposed.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Beneficiary'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: State or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Eligibility or business-rule failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Beneficiaries
      operationId: createBeneficiary
      summary: Create beneficiary from tokenized destination
      description: Creates a beneficiary owned by the caller. Requires an `ACTIVE` account (`422`
        otherwise). Malformed fields, a `country` or `payoutMethod` outside the enums, or a missing
        or malformed `Idempotency-Key` return `400`; so do a non-JSON body and any field that is
        not a JSON string (numbers and booleans are not coerced). In SIMULATION mode only
        destination tokens issued by the sandbox registry for the requested `country` and
        `payoutMethod` are accepted; any other token returns `422`. Replaying the same key with an
        identical request returns the originally created beneficiary; the same key with a
        different request, or after that beneficiary was deleted, returns `409`. If a concurrent
        request from the same customer holds the creation lock for longer than a short timeout,
        nothing is written and `503` with `Retry-After` is returned; retrying with the same
        `Idempotency-Key` is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryCreate'
      responses:
        '201':
          description: Created
          headers:
            X-Correlation-Id:
              description: Server-generated request identifier, recorded in the audit event when this
                request created the beneficiary.
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Beneficiary'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthenticated
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: State or idempotency conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Eligibility or business-rule failure
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Temporarily unable to process because of concurrent requests from the same
            customer; nothing was written. Retry with the same `Idempotency-Key`.
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
                minimum: 1
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Unique key per actor+operation; replay with different body returns 409
        schema:
          type: string
          minLength: 8
          maxLength: 128
  /v1/beneficiaries/{beneficiaryId}:
    parameters:
    - name: beneficiaryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Beneficiaries
      operationId: getBeneficiary
      summary: Read one of the caller's beneficiaries
      description: A beneficiary owned by another customer, a deleted beneficiary and an unknown ID
