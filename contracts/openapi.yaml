          $ref: '#/components/schemas/TransferPurpose'
    Transfer:
      type: object
      required:
      - id
      - quoteId
      - beneficiaryId
      - purpose
      - status
      - mode
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        quoteId:
          type: string
          format: uuid
        beneficiaryId:
          type: string
          format: uuid
        purpose:
          $ref: '#/components/schemas/TransferPurpose'
        status:
          type: string
          description: Workflow state, never a balance. Changes only along the documented state
            machine; `COMPLETED`, `REJECTED`, `CANCELLED` and `REFUNDED` are terminal, and `FAILED`
            can only move to `REFUND_PENDING`. In SIMULATION mode no state means money was moved.
          enum:
          - CREATED
          - AWAITING_KYC
          - AWAITING_FUNDING
          - FUNDING_CONFIRMED
          - PROCESSING
          - REVIEW_REQUIRED
          - COMPLETED
          - REJECTED
          - CANCELLED
          - FAILED
          - REFUND_PENDING
          - REFUNDED
        mode:
          type: string
          enum:
          - SIMULATION
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OfferCreate:
      type: object
      required:
      - sourceCurrency
      - targetCurrency
      - sourceTotalMinor
      - limitRate
      - expiresAt
      properties:
        sourceCurrency:
          type: string
          enum:
          - EUR
          - MAD
        targetCurrency:
          type: string
          enum:
          - EUR
          - MAD
        sourceTotalMinor:
          type: string
          description: Positive non-negative decimal integer in currency minor units; string prevents JSON precision
            loss
          pattern: ^[0-9]+$
        limitRate:
          type: string
          description: Decimal string; target currency per one source currency
          pattern: ^[0-9]+(\.[0-9]{1,12})?$
        expiresAt:
          type: string
          format: date-time
    Offer:
